# 前端團隊 profile 範例：示範如何把「組織規範」接進 AI context
#
# 這是範例，不是要你直接 extends 的設定。複製到你組織自己的 repo（例如公司的 GitLab），
# 把套件名稱、指令換成實際內容，再讓各專案的 kb.config.yaml 以路徑 extends 它：
#   extends:
#     - ../org-standards/profiles/frontend

review_days:
  api: 60                      # 前後端合約變動頻繁，比預設 90 天更常確認

skip_dirs: [.next, .turbo, storybook-static, coverage]
code_exts: [.mdx]

ai_context:
  instructions:
    - "UI 一律使用內部元件庫 @acme/ui。元件庫沒有的元件，不要自刻：列為未解問題，並指出應由設計系統負責人（Design）回答。"
    - "送出 MR 前必須通過 CI 固定流程（lint → type-check → unit test → visual regression），不得以停用檢查的方式通過。"
  include:
    - ui-standards.md
