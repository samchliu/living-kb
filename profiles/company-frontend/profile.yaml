# 公司前端專案 profile
# 由專案的 kb.config.yaml 以 `extends: [<路徑>/profiles/company-frontend]` 引用。
# TODO 標記處請換成公司實際內容。

review_days:
  api: 60                      # 前後端合約變動頻繁，比預設 90 天更常確認

skip_dirs: [.next, .turbo, storybook-static, coverage]
code_exts: [.mdx]

ai_context:
  instructions:
    - "UI 一律使用內部元件庫（TODO: 套件名稱，例如 @company/ui）。元件庫沒有的元件，不要自刻：列為未解問題，並指出應由設計系統負責人（TODO: 角色）回答。"
    - "送出 PR 前必須通過公司 CI 固定流程（TODO: 例如 lint → type-check → unit test → visual regression），不得以停用檢查的方式通過。"
  include:
    - ui-standards.md
