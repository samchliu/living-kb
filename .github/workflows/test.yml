name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Sample build is up to date
        run: |
          node bin/kb.js build --src examples/pos-recommendation --today 2026-09-16
          git diff --exit-code examples/pos-recommendation/_build
